<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WEPONARE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Start screen -->
  <div id="startScreen" class="overlay active">
    <div class="pixel-box start-box">
      <div class="title-text">WEPONARE</div>
      <div class="subtitle">ONLINE BATTLE</div>
      <input type="text" id="nameInput" class="name-input" placeholder="YOUR NAME" maxlength="12" autocomplete="off" spellcheck="false">

      <div class="mode-row">
        <button class="mode-btn btn-pvp"  id="modeBtn-pvp"        onclick="selectMode('pvp')">&#9876; PvP</button>
        <button class="mode-btn btn-coop" id="modeBtn-coop"       onclick="selectMode('coop')">&#9760; CO-OP</button>
        <button class="mode-btn btn-lm"   id="modeBtn-long_match" onclick="selectMode('long_match')">&#9733; LONG MATCH</button>
      </div>

      <!-- Long Match settings -->
      <div id="lmSettingsPanel" class="lm-settings hidden">
        <div class="setting-row">
          <span class="setting-label">WIN GOAL</span>
          <div id="winGoalBtns" class="limit-btns"></div>
        </div>
        <div class="setting-row top-pad">
          <span class="setting-label">ABILITY POOL</span>
        </div>
        <div id="lmPoolList" class="pool-list"></div>
      </div>

      <button class="join-btn" onclick="joinSelected()">JOIN GAME</button>
      <div class="hint-text">PvP: fight + monsters &nbsp;|&nbsp; Co-op: survive together &nbsp;|&nbsp; Long Match: pick your path</div>
    </div>
  </div>

  <!-- Lobby -->
  <div id="lobbyScreen" class="overlay hidden">
    <div class="pixel-box">
      <div class="title-text">WEPONARE</div>
      <div class="subtitle">ONLINE BATTLE</div>
      <div id="lobbyMsg" class="body-text">Connecting...</div>
      <div id="xpDisplay" class="xp-text"></div>
    </div>
  </div>

  <!-- Long Match weapon pick -->
  <div id="lmPickScreen" class="overlay hidden">
    <div class="pixel-box lm-pick-box">
      <div id="lmPickTitle" class="lm-pick-title"></div>
      <div id="lmPickSub" class="body-text"></div>
      <div id="lmWeaponGrid" class="weapon-grid"></div>
      <div id="lmPickFooter" class="lm-pick-footer"></div>
    </div>
  </div>

  <!-- Weapon unlock -->
  <div id="unlockScreen" class="overlay hidden">
    <div class="pixel-box unlock-box">
      <div class="unlock-title">NEW WEAPON!</div>
      <canvas id="unlockCanvas" width="120" height="80"></canvas>
      <div id="unlockName" class="weapon-name"></div>
      <div id="unlockDesc" class="body-text"></div>
      <div class="hint-text">PRESS SPACE TO CONTINUE</div>
    </div>
  </div>

  <!-- Round over -->
  <div id="roundScreen" class="overlay hidden">
    <div class="pixel-box">
      <div id="roundTitle" class="title-text"></div>
      <div id="roundStats" class="body-text"></div>
      <div class="hint-text">NEXT MATCH STARTING...</div>
    </div>
  </div>

  <!-- Disconnected -->
  <div id="disconnectedScreen" class="overlay hidden">
    <div class="pixel-box">
      <div class="title-text">DISCONNECTED</div>
      <div class="body-text">Opponent left the game.</div>
      <div class="hint-text">Returning to menu...</div>
    </div>
  </div>

  <canvas id="gameCanvas" width="480" height="270"></canvas>
  <script src="client.js"></script>
</body>
</html>
